<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">Beulah Foods</a>
    <nav id="site-header-nav" class="site-header__nav" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card card">
      <h1>Log in</h1>
      <p class="auth-card__subtitle">Welcome back.</p>

      <div id="form-alert" class="alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
      </form>

      <p class="auth-card__footer">
        <a href="forgot-password.html">Forgot your password?</a>
      </p>

      <p class="auth-card__footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
