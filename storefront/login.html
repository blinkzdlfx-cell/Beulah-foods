<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/storefront/" />
  <title>Log in — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo-wrap" href="index.html" aria-label="Beulah Foods home">
        <span class="site-header__mark" aria-hidden="true">B</span>
        <span class="site-header__brand">Beulah Foods</span>
      </a>
      <nav id="site-header-nav" class="site-header__nav" aria-label="Main navigation" hidden></nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-shell" aria-label="Customer login">
      <aside class="auth-intro">
        <div class="auth-intro__brand"><span class="auth-intro__mark">B</span> Beulah Foods</div>
        <div class="auth-intro__content">
          <p class="eyebrow">Welcome back</p>
          <h1>Good food starts with a thoughtful choice.</h1>
          <p>Sign in to manage your account and keep your delivery details ready for checkout.</p>
        </div>
      </aside>

      <div class="auth-card">
        <h2>Log in</h2>
        <p class="auth-card__subtitle">Use your Beulah Foods account details to continue.</p>

        <div id="form-alert" class="alert" role="alert" hidden></div>

        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
        </form>

        <p class="auth-card__footer"><a href="forgot-password.html">Forgot your password?</a></p>
        <p class="auth-card__footer">Don't have an account? <a href="signup.html">Create one</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
