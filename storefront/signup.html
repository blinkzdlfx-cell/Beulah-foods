<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">Beulah Foods</a>
    <nav id="site-header-nav" class="site-header__nav" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card card">
      <h1>Create your account</h1>
      <p class="auth-card__subtitle">It only takes a minute.</p>

      <div id="form-alert" class="alert" role="alert" hidden></div>

      <form id="signup-form" novalidate>
        <div class="form-field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="fullName" type="text" autocomplete="name" required />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
        </div>

        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="signup-submit">Sign up</button>
      </form>

      <p class="auth-card__footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/pages/signup.js"></script>
</body>
</html>
