<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">Beulah Foods</a>
    <nav id="site-header-nav" class="site-header__nav" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card card">
      <h1>Reset password</h1>
      <p class="auth-card__subtitle">Choose a new password for your account.</p>

      <div id="form-alert" class="alert" role="alert" hidden></div>

      <!-- Shown while Supabase is verifying the recovery link from the
           email and establishing the recovery session. -->
      <p id="reset-password-status" class="auth-card__subtitle">Verifying your reset link…</p>

      <form id="reset-password-form" novalidate hidden>
        <div class="form-field">
          <label for="new-password">New password</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required />
        </div>

        <div class="form-field">
          <label for="confirm-new-password">Confirm new password</label>
          <input id="confirm-new-password" name="confirmNewPassword" type="password" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="reset-password-submit">Set new password</button>
      </form>

      <p class="auth-card__footer">
        <a href="login.html">Back to log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
