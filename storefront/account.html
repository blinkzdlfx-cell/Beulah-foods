<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/storefront/" />
  <title>My Account — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">Beulah Foods</a>
    <nav id="site-header-nav" class="site-header__nav" hidden></nav>
  </header>

  <main class="account-page">
    <section class="page-heading">
      <p class="eyebrow">My account</p>
      <h1>Account details</h1>
      <p>Keep your contact and delivery information up to date for a smoother checkout.</p>
    </section>

    <section class="account-layout" aria-label="Account details">
      <aside class="account-summary card">
        <div class="account-avatar" id="account-avatar" aria-hidden="true">B</div>
        <div>
          <p class="account-summary__label">Signed in as</p>
          <strong id="account-email">Loading...</strong>
        </div>
        <a class="account-summary__link" href="index.html">Continue shopping</a>
      </aside>

      <div class="card account-form-card">
        <div id="account-alert" class="alert" role="status" aria-live="polite" hidden></div>

        <form id="account-form" novalidate>
          <div class="form-field">
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" type="text" autocomplete="name" required />
          </div>

          <div class="form-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" disabled />
            <small>Your email is managed by your authentication account.</small>
          </div>

          <div class="form-field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" />
          </div>

          <div class="form-field">
            <label for="address">Delivery address</label>
            <textarea id="address" name="address" rows="4" autocomplete="street-address"></textarea>
          </div>

          <button class="btn btn-primary" type="submit" id="save-profile">Save changes</button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="js/pages/account.js"></script>
</body>
</html>
