<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><base href="/storefront/" /><title>Checkout — Beulah Foods</title><link rel="icon" href="assets/favicon.webp" /><link rel="stylesheet" href="css/variables.css" /><link rel="stylesheet" href="css/base.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/cart.css" /></head>
<body><header class="site-header"><div class="site-header__inner"><a class="site-header__logo-wrap" href="index.html" aria-label="Beulah Foods home"><img class="site-header__logo" src="assets/beulah-logo.webp" alt="Beulah Foods"></a><nav id="site-header-nav" class="site-header__nav" aria-label="Main navigation" hidden></nav></div></header>
<main class="checkout-page"><section class="checkout-heading"><p class="eyebrow">Secure checkout</p><h1>Complete your order.</h1><p>Your delivery details and any active store discounts are validated from the live store settings before payment.</p></section><div id="checkout-status" class="checkout-status" role="status" aria-live="polite" hidden></div><div id="checkout-auth-notice" class="checkout-auth-notice" hidden></div><div class="checkout-content"><form id="checkout-form" class="checkout-card card" hidden><h2>Delivery details</h2><div class="form-field"><label for="full-name">Full name</label><input id="full-name" name="fullName" autocomplete="name" required /></div><div class="form-field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required /></div><div class="form-field"><label for="address">Delivery address</label><textarea id="address" name="address" rows="5" autocomplete="street-address" required></textarea></div><div class="form-field"><label for="promo-code">Promo code <span class="muted">(optional)</span></label><input id="promo-code" name="promoCode" autocomplete="off" maxlength="50" placeholder="Enter promo code" /></div><button id="checkout-submit" class="btn btn-primary checkout-submit" type="submit" disabled>Continue to payment</button></form><aside class="checkout-card card"><h2>Order summary</h2><div id="checkout-items" class="checkout-items"></div><div class="cart-summary__row"><span>Subtotal</span><strong id="checkout-subtotal">₦0.00</strong></div><div id="checkout-delivery-row" class="cart-summary__row" hidden><span>Delivery</span><strong id="checkout-delivery">—</strong></div><div class="cart-summary__row"><span>Discount</span><strong id="checkout-discount">₦0.00</strong></div><div class="cart-summary__row"><span>Total</span><strong id="checkout-total">₦0.00</strong></div></aside></div></main><script type="module" src="js/pages/checkout.js"></script></body></html>
