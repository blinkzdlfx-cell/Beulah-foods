<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><base href="/storefront/" /><title>Checkout — Beulah Foods</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="css/variables.css" /><link rel="stylesheet" href="css/base.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/cart.css" /></head>
<body><header class="site-header"><div class="site-header__inner"><a class="site-header__logo-wrap" href="index.html" aria-label="Beulah Foods home"><span class="site-header__mark" aria-hidden="true">B</span><span class="site-header__brand">Beulah Foods</span></a><nav id="site-header-nav" class="site-header__nav" aria-label="Main navigation" hidden></nav></div></header>
<main class="checkout-page"><section class="checkout-heading"><p class="eyebrow">Secure checkout</p><h1>Complete your order.</h1><p>Your profile information is used to prepare delivery details. Payment is intentionally not activated until the real payment provider and server-side verification are connected.</p></section><div id="checkout-status" class="checkout-status" role="status" aria-live="polite" hidden></div><div id="checkout-auth-notice" class="checkout-auth-notice" hidden></div><div class="checkout-content"><form id="checkout-form" class="checkout-card card" hidden><h2>Delivery details</h2><div class="form-field"><label for="full-name">Full name</label><input id="full-name" name="fullName" autocomplete="name" required /></div><div class="form-field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required /></div><div class="form-field"><label for="address">Delivery address</label><textarea id="address" name="address" rows="5" autocomplete="street-address" required></textarea></div><button id="checkout-submit" class="btn btn-primary checkout-submit" type="submit" disabled>Continue to payment</button></form><aside class="checkout-card card"><h2>Order summary</h2><div id="checkout-items" class="checkout-items"></div><div class="cart-summary__row"><span>Subtotal</span><strong id="checkout-subtotal">₦0.00</strong></div></aside></div></main><script type="module" src="js/pages/checkout.js"></script></body></html>
