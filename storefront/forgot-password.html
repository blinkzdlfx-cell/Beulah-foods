<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Beulah Foods</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">Beulah Foods</a>
    <nav id="site-header-nav" class="site-header__nav" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card card">
      <h1>Forgot password</h1>
      <p class="auth-card__subtitle">We'll email you a link to reset it.</p>

      <div id="form-alert" class="alert" role="alert" hidden></div>

      <form id="forgot-password-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <button type="submit" class="btn btn-primary" id="forgot-password-submit">Send reset link</button>
      </form>

      <p class="auth-card__footer">
        Remembered your password? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
