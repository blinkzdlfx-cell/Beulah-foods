name: Beulah Foods Phase 3 Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase3:
    name: Phase 3 unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development tooling
        run: npm install --ignore-scripts

      - name: Run Phase 3 tests
        run: npm test

      - name: Phase 3 summary
        run: echo "Phase 3 unit and integration tests completed successfully."
