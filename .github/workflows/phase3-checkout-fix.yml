name: Phase 3 checkout contract fix

on:
  push:
    branches:
      - phase3/unit-integration-tests
    paths:
      - storefront/js/pages/checkout.js
      - .github/workflows/phase3-checkout-fix.yml

permissions:
  contents: write

jobs:
  fix-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/unit-integration-tests
          fetch-depth: 0

      - name: Restore checkout and remove premature cart deletion
        shell: bash
        run: |
          git checkout 82ccce9717c11ab8557da365dbb521d2055b7c57 -- storefront/js/pages/checkout.js
          python - <<'PY'
          from pathlib import Path
          path = Path("storefront/js/pages/checkout.js")
          text = path.read_text()
          text = text.replace(
              'import { getCart, removeCartItems } from "../services/cartService.js";',
              'import { getCart } from "../services/cartService.js";',
          )
          lines = [line for line in text.splitlines() if "removeCartItems(" not in line]
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit checkout contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storefront/js/pages/checkout.js
          if git diff --cached --quiet; then
            echo "No checkout change required."
            exit 0
          fi
          git commit -m "fix: keep cart until successful payment"
          git push origin HEAD:phase3/unit-integration-tests
