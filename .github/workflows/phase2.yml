name: Beulah Foods Phase 2 Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase2:
    name: Phase 2 project checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install development tooling
        run: npm install --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run formatting check
        id: format_check
        continue-on-error: true
        run: npm run format:check

      - name: Diagnose formatting differences
        if: steps.format_check.outcome == 'failure'
        run: |
          npx prettier --list-different "storefront/**/*.js" "admin/**/*.js" "worker.js" | tee prettier-differences.txt
          exit 1

      - name: Upload formatting diagnostics
        if: steps.format_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: prettier-differences
          path: prettier-differences.txt

      - name: Run static validation
        run: npm run static:check

      - name: Phase 2 summary
        run: echo "Phase 2 project checks completed successfully."
